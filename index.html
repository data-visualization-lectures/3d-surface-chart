<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D Surface Chart</title>

  <!-- dataviz.jp shared libs (embed時はスキップ) -->
  <script>
  (function () {
    if (new URLSearchParams(location.search).get('embed') === '1') return;

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = () => reject(new Error('Failed to load: ' + src));
        document.head.appendChild(s);
      });
    }

    (async () => {
      try {
        await loadScript('https://app.dataviz.jp/lib/supabase.js');
        await loadScript('https://app.dataviz.jp/lib/dataviz-auth-client.js');
        await loadScript('https://id.data-viz-lectures.com/lib/dataviz-tool-header.js');
      } catch (err) {
        console.error('[3d-surface-chart] shared libs load failed:', err);
      }
    })();
  })();
  </script>

  <!-- Import map for Three.js (3D Surface Chart — loaded on demand) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Styles -->
  <script>
  (function () {
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://app.dataviz.jp/lib/dvz-editor-shell.v1.css';
    link.onerror = () => {
      const fallback = document.createElement('link');
      fallback.rel = 'stylesheet';
      fallback.href = 'css/dvz-common.css';
      document.head.appendChild(fallback);
    };
    document.head.appendChild(link);
  })();
  </script>
  <noscript><link rel="stylesheet" href="css/dvz-common.css"></noscript>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 text-gray-800 antialiased">

  <dataviz-tool-header></dataviz-tool-header>

  <div class="dvz-app flex" data-dvz-view="selector">

    <!-- ====================================================== -->
    <!-- Main area                                               -->
    <!-- ====================================================== -->
    <div id="main-area" class="flex flex-1 flex-col overflow-y-auto bg-white">

      <!-- Chart Selector (initial screen) -->
      <div id="chart-selector" class="flex flex-1 justify-center px-6 py-10 sm:px-8 lg:px-10">
        <main class="dvz-catalog" aria-labelledby="dvz-catalog-title">
          <header class="dvz-catalog__header">
            <p class="dvz-catalog__kicker">3D Chart Tool</p>
            <h1 id="dvz-catalog-title" class="dvz-catalog__title">3D Surface Chart</h1>
            <p class="dvz-catalog__lead">CSV データを 3D 曲面として可視化します。</p>
          </header>
          <div id="chart-selector-grid" class="dvz-catalog__grid">
            <!-- Cards injected by interactive-chart-builder.js -->
          </div>
        </main>
      </div>

      <!-- Chart view (hidden until template selected) -->
      <main id="dvz-chart" class="relative flex flex-1 flex-col px-4 py-3" hidden aria-hidden="true">
        <!-- Back to selector -->
        <div id="chart-switcher" class="mb-2 flex items-center gap-2">
          <button id="chart-back-btn" type="button" class="text-sm text-gray-500 hover:text-gray-700">&larr; 一覧</button>
          <span id="chart-type-name" class="text-sm font-normal text-black empty:hidden"></span>
        </div>
        <h1 id="chart-title" class="mb-1 self-start text-lg font-semibold text-gray-900 empty:hidden"></h1>
        <div id="chart-area" class="relative flex flex-1 items-center justify-center">
          <div id="chart-container" class="w-full">
            <div class="empty-state">
              <div style="font-size:48px; opacity:0.4;">📊</div>
              <div data-i18n="emptyState">CSV をアップロード、または「サンプル」ボタンを押してください</div>
            </div>
          </div>
        </div>
        <div id="dvz-controls" class="mt-3 empty:hidden"></div>
        <div id="chart-source" class="mt-2 self-start text-xs text-gray-400 empty:hidden"></div>
      </main>

      <!-- Site links -->
      <div id="dvz-site-links" class="dvz-site-links py-3 text-center text-xs text-gray-400">
        <a href="https://www.dataviz.jp/" target="_blank" rel="noopener" class="hover:text-gray-600">dataviz.jp</a>
      </div>
    </div>

    <!-- ====================================================== -->
    <!-- Right sidebar (hidden until template selected)          -->
    <!-- ====================================================== -->
    <aside id="dvz-sidebar" class="dvz-sidebar flex w-96 shrink-0 flex-col overflow-x-hidden border-l border-gray-200 bg-white" hidden aria-hidden="true">

      <!-- Tabs -->
      <div class="border-b border-gray-200">
        <div class="grid grid-cols-1 sm:hidden px-5 pt-4 pb-3">
          <select id="sidebar-tab-select" aria-label="Select a tab" class="col-start-1 row-start-1 w-full appearance-none rounded-md bg-white py-2 pr-8 pl-3 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600">
            <option value="tab-data" selected data-i18n="tabData">Data</option>
            <option value="tab-mapping" data-i18n="tabMapping">Mapping</option>
            <option value="tab-style" data-i18n="tabStyle">Style</option>
            <option value="tab-annotate" data-i18n="tabAnnotate">Annotate</option>
            <option value="tab-export" data-i18n="tabExport">Export</option>
          </select>
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" class="pointer-events-none col-start-1 row-start-1 mr-2 size-5 self-center justify-self-end fill-gray-500"><path d="M4.22 6.22a.75.75 0 0 1 1.06 0L8 8.94l2.72-2.72a.75.75 0 1 1 1.06 1.06l-3.25 3.25a.75.75 0 0 1-1.06 0L4.22 7.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" fill-rule="evenodd"/></svg>
        </div>
        <nav class="hidden sm:flex" aria-label="Tabs">
          <button type="button" data-tab="tab-data" data-i18n="tabData" class="sidebar-tab flex-1 border-b-2 border-indigo-500 px-4 py-3 text-center text-sm font-medium text-indigo-600">Data</button>
          <button type="button" data-tab="tab-mapping" data-i18n="tabMapping" class="sidebar-tab flex-1 border-b-2 border-transparent px-4 py-3 text-center text-sm font-medium text-gray-500 hover:border-gray-300 hover:text-gray-700">Mapping</button>
          <button type="button" data-tab="tab-style" data-i18n="tabStyle" class="sidebar-tab flex-1 border-b-2 border-transparent px-4 py-3 text-center text-sm font-medium text-gray-500 hover:border-gray-300 hover:text-gray-700">Style</button>
          <button type="button" data-tab="tab-annotate" data-i18n="tabAnnotate" class="sidebar-tab flex-1 border-b-2 border-transparent px-4 py-3 text-center text-sm font-medium text-gray-500 hover:border-gray-300 hover:text-gray-700">Annotate</button>
          <button type="button" data-tab="tab-export" data-i18n="tabExport" class="sidebar-tab flex-1 border-b-2 border-transparent px-4 py-3 text-center text-sm font-medium text-gray-500 hover:border-gray-300 hover:text-gray-700">Export</button>
        </nav>
      </div>

      <!-- Tab panels -->
      <div class="flex flex-1 flex-col overflow-hidden">

        <!-- Data tab (content injected by module) -->
        <div id="tab-data" class="sidebar-panel flex flex-1 flex-col overflow-hidden">
          <div class="flex-1 overflow-y-auto">
            <!-- Module-specific data panel content injected here -->
          </div>
        </div>

        <!-- Mapping tab (content injected by module) -->
        <div id="tab-mapping" class="sidebar-panel hidden flex-1 overflow-y-auto">
          <!-- Module-specific mapping panel content injected here -->
        </div>

        <!-- Style tab (content injected by module) -->
        <div id="tab-style" class="sidebar-panel hidden flex-1 overflow-y-auto">
          <!-- Module-specific style panel content injected here -->
        </div>

        <!-- Annotate tab (shared across all charts) -->
        <div id="tab-annotate" class="sidebar-panel hidden flex-1 flex-col overflow-hidden">
          <div class="flex-1 overflow-y-auto">
            <section class="border-b border-gray-100 px-5 py-4">
              <label for="annotate-title" class="mb-2 block text-[11px] font-bold uppercase tracking-wide text-gray-400" data-i18n="annotateTitle">Title</label>
              <input type="text" id="annotate-title" class="w-full rounded border border-gray-300 px-3 py-2 text-sm focus:border-gray-500 focus:outline-none" data-i18n="annotateTitlePlaceholder" placeholder="Chart title">
            </section>
            <section class="border-b border-gray-100 px-5 py-4">
              <label for="annotate-source" class="mb-2 block text-[11px] font-bold uppercase tracking-wide text-gray-400" data-i18n="annotateSource">Source</label>
              <input type="text" id="annotate-source" class="mb-3 w-full rounded border border-gray-300 px-3 py-2 text-sm focus:border-gray-500 focus:outline-none" data-i18n="annotateSourcePlaceholder" placeholder="Data source name">
              <label for="annotate-source-url" class="mb-2 block text-[11px] font-bold uppercase tracking-wide text-gray-400" data-i18n="annotateSourceUrl">Source URL</label>
              <input type="url" id="annotate-source-url" class="w-full rounded border border-gray-300 px-3 py-2 text-sm focus:border-gray-500 focus:outline-none" placeholder="https://...">
            </section>
            <section class="px-5 py-4">
              <label for="legend-position" class="mb-2 block text-[11px] font-bold uppercase tracking-wide text-gray-400" data-i18n="annotateLegend">Legend</label>
              <select id="legend-position" class="w-full rounded border border-gray-300 bg-white px-3 py-2 text-sm focus:border-gray-500 focus:outline-none">
                <option value="none" data-i18n="legendNone">None</option>
                <option value="top-right" selected data-i18n="legendTopRight">Top Right</option>
                <option value="bottom-right" data-i18n="legendBottomRight">Bottom Right</option>
              </select>
            </section>
          </div>
          <div class="shrink-0 border-t border-gray-200 px-5 py-4">
            <button id="annotate-apply-btn" class="w-full rounded-md bg-gray-900 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-gray-700" data-i18n="apply">Apply</button>
          </div>
        </div>

        <!-- Export tab (shared across all charts) -->
        <div id="tab-export" class="sidebar-panel hidden flex-1 overflow-y-auto">
          <section class="px-5 py-4">
            <h3 class="mb-3 text-[11px] font-bold uppercase tracking-wide text-gray-400" data-i18n="exportImage">Image</h3>
            <div class="flex flex-col gap-3">
              <button id="export-svg-btn" class="flex w-full items-center justify-center gap-2 rounded-md bg-white px-4 py-2.5 text-sm font-semibold text-gray-700 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50">
                <svg class="h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
                SVG
              </button>
              <button id="export-png-btn" class="flex w-full items-center justify-center gap-2 rounded-md bg-white px-4 py-2.5 text-sm font-semibold text-gray-700 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50">
                <svg class="h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
                PNG (2x)
              </button>
            </div>
          </section>
          <section class="border-t border-gray-100 px-5 py-4">
            <h3 class="mb-3 text-[11px] font-bold uppercase tracking-wide text-gray-400" data-i18n="exportData">Data</h3>
            <div class="flex flex-col gap-3">
              <button id="export-csv-btn" class="flex w-full items-center justify-center gap-2 rounded-md bg-white px-4 py-2.5 text-sm font-semibold text-gray-700 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50">
                <svg class="h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
                CSV
              </button>
              <button id="export-json-btn" class="flex w-full items-center justify-center gap-2 rounded-md bg-white px-4 py-2.5 text-sm font-semibold text-gray-700 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50">
                <svg class="h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
                JSON
              </button>
            </div>
          </section>
        </div>

      </div>
    </aside>

  </div>

  <!-- Tooltip -->
  <div id="tooltip" class="dvz-tooltip" style="display:none;"></div>

  <!-- Chart-specific tooltip containers -->
  <div id="bump-tooltip" class="bump-tooltip"></div>

  <script src="https://app.dataviz.jp/lib/dvz-editor-shell.v1.js"></script>
  <script src="js/dvz-common.js"></script>
  <script src="https://app.dataviz.jp/lib/settings-compat.js"></script>
  <script src="js/chart-registry.js"></script>
  <script src="js/core/routing.js"></script>
  <script src="js/core/renderer-adapters.js"></script>
  <script src="js/core/share-service.js"></script>
  <script src="js/core/header-manager.js"></script>
  <script src="js/core/runtime.js"></script>
  <script src="js/interactive-chart-builder.js"></script>
</body>
</html>
