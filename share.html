<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Surface Chart</title>

<!-- OGP meta tags (updated dynamically after data fetch) -->
<meta property="og:type" content="website">
<meta property="og:title" content="3D Surface Chart">
<meta property="og:image" content="">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="3D Surface Chart">
<meta name="twitter:image" content="">

<!-- Three.js importmap (for WebGL charts) -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<!-- Libraries -->
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>

<script>
(function () {
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = 'https://app.dataviz.jp/lib/dvz-share-shell.v1.css';
  link.onerror = () => {
    const fallback = document.createElement('link');
    fallback.rel = 'stylesheet';
    fallback.href = 'css/dvz-share-shell.v1.css';
    document.head.appendChild(fallback);
  };
  document.head.appendChild(link);
})();
</script>
<noscript><link rel="stylesheet" href="css/dvz-share-shell.v1.css"></noscript>

<style>
body.dvz-share-shell--document {
  --dvz-control-select-width: 180px;
  --dvz-share-chart-height: clamp(320px, 62vh, 760px);
  --dvz-share-chart-min-height: 320px;
  --dvz-share-chart-padding: 0px;
  --dvz-share-chart-overflow: hidden;
}

#chart-container svg { width: 100%; height: 100%; display: block; }
#chartBlock { width: 100%; height: 100%; }
#chartBlock > svg { width: 100%; height: 100%; display: block; }

/* Chart-specific tooltip styles */
.stream-tooltip, .bee-tooltip {
  position: absolute; pointer-events: none;
  background: rgba(40,40,40,0.94); color: #fff;
  padding: 8px 12px; border-radius: 6px;
  font-size: 12px; line-height: 1.5;
  box-shadow: 0 3px 10px rgba(0,0,0,0.2);
  z-index: 100; white-space: nowrap;
  opacity: 0; transition: opacity 0.12s ease;
}
.bump-tooltip {
  position: fixed; pointer-events: none;
  background: rgba(0,0,0,0.8); color: #fff;
  padding: 6px 10px; border-radius: 4px;
  font-size: 0.75rem; line-height: 1.4;
  white-space: nowrap; opacity: 0;
  transition: opacity 0.15s; z-index: 100;
}
.bump-tooltip.visible { opacity: 1; }

/* Chart type styles */
.stream-layer { transition: opacity 0.2s; cursor: pointer; }
.dimmed .stream-layer { opacity: 0.15; }
.dimmed .stream-layer.highlighted { opacity: 1; }
.bump-line { fill: none; stroke-width: 2.5; transition: opacity 0.2s; cursor: pointer; }
.bump-circle { stroke: #fff; stroke-width: 2; transition: opacity 0.2s; cursor: pointer; }
.bump-label { font-size: 12px; font-weight: 600; transition: opacity 0.2s; }
.dimmed .bump-line, .dimmed .bump-circle, .dimmed .bump-label { opacity: 0.1; }
.dimmed .bump-line.highlighted, .dimmed .bump-circle.highlighted, .dimmed .bump-label.highlighted { opacity: 1; }
.axis-label { font-size: 12px; fill: #666; }
.rank-label { font-size: 11px; fill: #999; }
.grid-line { stroke: #eee; stroke-width: 1; }
circle.dot { transition: opacity 0.15s ease; }
.venn-circle path { fill-opacity: 0.55; stroke-width: 2; stroke: #fff; transition: fill-opacity 0.2s ease; }
.venn-circle text { font-size: 15px; font-weight: 700; fill: #333; pointer-events: none; }
.venn-intersection text { pointer-events: none; }
.venn-intersection path { fill-opacity: 0; stroke: none; transition: fill-opacity 0.2s ease; }
.axis path, .axis line { stroke: #ccc; shape-rendering: crispEdges; }
.axis text { fill: #999; font-size: 10px; }
.year-ticker { font-size: 64px; font-weight: 800; fill: #e8e8ed; font-variant-numeric: tabular-nums; pointer-events: none; }
.node { cursor: pointer; transition: opacity 150ms ease; }
.node.is-faded { opacity: 0.2; }
.group-label { font-size: 0.88rem; font-weight: 700; fill: #4a4232; text-anchor: middle; }
.control-chip-group { display: inline-flex; align-items: center; gap: 4px; padding: 2px; border-radius: 999px; background: #d1d5db; }
.control-chip { border: 1px solid transparent; background: transparent; color: #4b5563; padding: 6px 12px; border-radius: 999px; font-weight: 600; font-size: 0.78rem; cursor: pointer; }
.control-chip.is-active { background: #fff; color: #111827; border-color: transparent; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08); }
.summary-grid { display: inline-flex; align-items: center; gap: 14px; margin-left: auto; }
.summary-item { display: inline-flex; align-items: center; gap: 6px; background: transparent; border: none; padding: 0; white-space: nowrap; }
.summary-item .label { color: #6f6654; font-size: 0.68rem; text-transform: uppercase; }
.summary-item .value { font-size: 0.9rem; font-weight: 700; }
.cp-row { display: flex; flex: 1 1 auto; width: 100%; }

/* WebGL axis labels */
#chart-container > .axis-label {
  position: absolute; font-size: 0.7rem; color: #666;
  pointer-events: none; white-space: nowrap; transition: opacity 0.1s;
}
#chart-container > .axis-label.vertical { writing-mode: vertical-rl; font-size: 0.6rem; }
#chart-container > .axis-label.title { font-size: 0.8rem; font-weight: 600; color: #444; }
.view-btn { transition: all 0.15s; }
.view-btn.active { background: #333 !important; color: #fff !important; border-color: #333 !important; }
#legend { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 0.8rem; color: #666; }
#legend canvas { border-radius: 3px; border: 1px solid #ddd; }
</style>
</head>
<body class="dvz-share-shell--document">

<div class="dvz-app">
  <div id="dvz-loading">読み込み中...</div>
  <div id="dvz-error"></div>

  <div id="dvz-content">
    <h1 id="chart-title"></h1>
    <div id="chart-source"></div>
    <div id="chart-container"></div>
    <div id="dvz-controls"></div>
  </div>

  <div class="dvz-cta">
    <a href="https://3d-surface-chart.dataviz.jp/">自分もチャートを作る</a>
  </div>
  <div class="dvz-site-links">
    <a href="https://www.dataviz.jp/3d-surface-chart/">3D Surface Chart</a>
    <span>|</span>
    <a href="https://www.dataviz.jp/">dataviz.jp</a>
  </div>
</div>

<!-- Tooltip containers -->
<div id="tooltip" class="dvz-tooltip" style="display:none;"></div>
<div id="bump-tooltip" class="bump-tooltip"></div>

<!-- dvz-common.js + chart-registry.js (chart module loader reuses these) -->
<script src="js/dvz-common.js"></script>
<script src="https://app.dataviz.jp/lib/settings-compat.js"></script>
<script src="js/chart-registry.js"></script>
<script src="js/core/routing.js"></script>
<script src="js/core/renderer-adapters.js"></script>
<script>
  (function () {
    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = () => reject(new Error('Failed to load: ' + src));
        document.body.appendChild(s);
      });
    }

    (async () => {
      try {
        await loadScript('https://app.dataviz.jp/lib/dvz-share-shell.v1.js');
      } catch (_error) {
        await loadScript('js/dvz-share-shell.v1.js');
      }

      if (!window.DVZShareShell) {
        await loadScript('js/dvz-share-shell.v1.js');
      }

      await loadScript('js/share-runtime.js');
    })().catch((error) => {
      console.error('[3d-surface-chart] share libs load failed:', error);
    });
  })();
</script>
</body>
</html>
